# =====================================================================
# Employee Payroll Management System - application settings
# Override any value in  config/application-local.properties
# (or point the PAYROLL_CONFIG environment variable at another file).
# NEVER put real passwords in this file - it is committed to source control.
# =====================================================================

# ---- Database (password is intentionally absent) ---------------------
db.url=jdbc:mysql://localhost:3306/employee_payroll_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
db.username=root
db.password=root            <- set via PAYROLL_DB_PASSWORD or config/application-local.properties

# ---- Company information (printed on payslips) -----------------------
company.name=Your Company Name Pvt. Ltd.
company.address=123 Business Park, Your City, Your State - 000000
company.phone=+91-00000-00000
company.email=hr@yourcompany.example
currency.label=INR

# ---- Payroll policy ---------------------------------------------------
# The payroll period is always one calendar month.
#
# How many "payable days" does the month have? This is the divisor used to
# turn a monthly amount into a per-day amount for unpaid-leave deduction.
#   CALENDAR_DAYS : actual days in the month (28-31)
#   WORKING_DAYS  : days in the month that are not weekly offs
#   FIXED         : always payroll.payable.days.fixed (e.g. 30)
payroll.payable.days.mode=CALENDAR_DAYS
payroll.payable.days.fixed=30

# Comma separated weekly off days (DayOfWeek names). Leave blank for none.
payroll.weekly.off=SUNDAY

# What to do with a working day that has no attendance record?
#   PRESENT : assume present (attendance is recorded by exception)
#   ABSENT  : treat as unpaid absence
payroll.missing.attendance=PRESENT

# Fraction of a HALF_DAY that is unpaid (0.5 = half a day's pay is deducted)
payroll.halfday.unpaid.fraction=0.5

# Salary base used for the unpaid-days deduction: GROSS or BASIC
payroll.proration.base=GROSS

# Rounding policy for every monetary calculation
payroll.rounding.scale=2
payroll.rounding.mode=HALF_UP

# A negative net salary is rejected unless this is true
payroll.allow.negative.net=false

# Optional policy override (NOT a statutory rule): provident fund as a percentage
# of BASIC salary. Leave blank to use the fixed PF amount stored in the salary structure.
payroll.pf.percent.of.basic=

# ---- Leave policy -----------------------------------------------------
# Annual quota (days per calendar year) for each paid leave type.
leave.quota.ANNUAL=18
leave.quota.SICK=10
leave.quota.CASUAL=8
# UNPAID leave has no quota.
# How far in the past (days) a leave request may start.
leave.max.backdate.days=30
# Longest single leave request in working days
leave.max.request.days=60

# ---- Payslip output ---------------------------------------------------
payslip.output.dir=payslips

# ---- Security ---------------------------------------------------------
security.password.min.length=8
security.bcrypt.cost=12
